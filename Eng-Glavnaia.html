<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret.Kot - Main Page</title>
    <style>
        @font-face {
            font-family: 'Ciutadella';
            src: local('CiutadellaDisplay-XBd'), 
                 url('CiutadellaDisplay-XBd.woff') format('woff');
            font-weight: 800;
            font-style: italic;
            font-display: swap;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #FE3231;
            transition: background-color 0.5s;
        }
        
        body.dimmed {
            background-color: rgba(0, 0, 0, 0.7);
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px;
            background-color: rgb(255,140,0);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-family: 'Ciutadella', Arial, sans-serif;
            font-size: 32px;
            font-weight: 800;
            font-style: italic;
            color: #333;
            letter-spacing: 1px;
            text-transform: uppercase;
            position: absolute;
            left: 10%;
            transform: translateX(-50%);
        }
        
        .nav-buttons {
            display: flex;
            gap: 15px;
            margin-left: auto;
        }
        
        .nav-buttons a {
            text-decoration: none;
            color: #333;
            padding: 8px 15px;
            border-radius: 8px;
            transition: all 0.3s;
            font-family: Arial, sans-serif;
        }
        
        .nav-buttons a:hover {
            background-color: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        /* Языковая коробочка для десктопа */
        .language-box {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 5px 10px 5px 5px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(0,0,0,0.1);
            margin-left: 10px;
        }
        
        .language-box:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }
        
        .language-flag {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #333;
        }
        
        .language-name {
            font-size: 14px;
            color: #333;
            font-weight: bold;
            font-style: normal;
        }

        /* Языковая коробочка для мобильных */
        .mobile-language-box {
            display: none;
            position: absolute;
            right: 20px;
            top: 15px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(0,0,0,0.1);
            justify-content: center;
            align-items: center;
        }
        
        .mobile-language-box img {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #333;
        }

        .image-container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .main-image {
            position: absolute;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
        }
        
        .main-title {
            font-family: 'Ciutadella', Arial, sans-serif;
            font-size: 6vw;
            font-weight: 800;
            font-style: italic;
            color: white;
            text-shadow: 3px 3px 0 #000;
            white-space: nowrap;
            text-transform: uppercase;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .center-button {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 32px;
            padding: 25px 50px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 350px;
            text-align: center;
            z-index: 10;
        }
        
        .center-button:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: scale(1.05);
        }

        .search-container {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 250px;
            background-color: rgb(255, 140, 0);
            top: 80px;
        }
        
        .search-input {
            padding: 10px 10px;
            border-radius: 0px;
            border: 2px solid #333333;
            width: 250px;
            transition: all 0.3s;
            font-size: 14px;
            background-color: rgb(255, 140, 0);
        }
        
        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            width: 250px;
            background: rgb(255, 100, 0);
            border-radius: 0 0 10px 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            display: none;
        }
        
        .search-result-item {
            padding: 10px 15px;
            border-bottom: solid #ffffff00;
            cursor: pointer;
        }
        
        .search-result-item:hover {
            background: rgb(255, 100, 0);
            color: rgb(255, 225, 0);
            border-radius: 0 0 10px 10px;
        }
        
        .scroll-down-btn {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.3);
            color: white;
            border: 2px solid white;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 10;
        }
        
        .scroll-down-btn:hover {
            background: rgba(255,255,255,0.5);
            transform: translateX(-50%) scale(1.05);
        }
        
        .dont-push-container {
            text-align: center;
            padding: 40px 0;
            position: relative;
            background: #FE3231;
        }
        
        .dont-push-btn {
            background: red;
            color: white;
            border: 3px solid black;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
        }
        
        .dont-push-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255,0,0,0.7);
        }

        /* Адаптивность */
        @media (max-width: 650px) {
            .logo {
                position: static;
                transform: none;
                text-align: center;
                width: 100%;
                padding: 10px;
                   
            }

            .nav-buttons {
                display: none;
            }
            
            .language-box {
                display: block;
            }
            
            .mobile-language-box {
                display: flex;
                top: 20%;
            }
            
            .search-container {
                top: 25%;
                left: 50%;
                transform: translateX(-50%);
                width: 250px;
            }
            
            .search-input {
                width: 250px;
            }
        }

        @media (min-width: 100px) {
            header {
                flex-direction: column;
                padding: 20px;
            }
            
            .logo {
                margin-bottom: 10px;
                font-size: 32px;
                left: 110px;
            }
            
            .search-container {
                top: 100%;
                width: 250px;
            }
            
            .main-title {
                font-size: 8vw;
            } 
            
            .center-button {
                min-width: 250px;
                font-size: 24px;
                padding: 15px 30px;
            }
            
            .scroll-down-btn {
                padding: 10px 20px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">SECRET.KOT</div>

        <!-- Языковая коробочка для мобильных -->
        <div class="mobile-language-box" onclick="window.location.href='Language_Switcher.html'">
            <img src="english-flag.png" alt="English">
        </div>

            <nav class="nav-buttons">
            <a href="Eng-Glavnaia.html" id="main-link">Main Page</a>
            <a href="Eng-O_nas.html">About Us</a>
            <a href="Eng-Korzina.html">Basket</a>
            <a href="Eng-Profile.html">Profile</a>
            
            <!-- Языковая коробочка для десктопа -->
            <div class="language-box" onclick="window.location.href='Eng-Language_Switcher.html'">
                <img src="english-flag.png" class="language-flag" alt="English">
                <div class="language-name">ENG</div>
            </div>
        </nav>

         <div class="search-container">
            <input type="text" class="search-input" placeholder="Search something..." id="globalSearch">
            <div class="search-results" id="searchResults"></div>
        </div>
    </header>
    
    <main>
        <div class="image-container" id="section1">
            <img src="sk.png" alt="Secret.Kot" class="main-image">
            <div class="main-title">Main page</div>
            <button class="scroll-down-btn" onclick="scrollToSection('section2')">Scroll Down</button>
        </div>
        
        <div class="image-container" id="section2">
            <img src="sk2.png" alt="Secret.Kot" class="main-image">
            <button class="center-button" onclick="window.location.href='Vibor.html'">Pick up a Secret Kot</button>
        </div>
        
        <div class="image-container" id="section3">
            <img src="sk3.png" alt="Secret.Kot" class="main-image">
        </div>
        
        <div class="dont-push-container">
            <button id="myButton" class="dont-push-btn" 
                    onmouseover="document.body.classList.add('dimmed')"
                    onmouseout="document.body.classList.remove('dimmed')">
                Do not touch it ...
            </button>
                 
    <script>                                                        <!-- Странные Скрипты -->
    const button = document.getElementById('myButton');
    const targetURL = 'https://osu.ppy.sh/users/37418790';

  button.addEventListener('click', function() {
    if (confirm('Warning! You link to the builder of this web-site!                               Are you sure?')) {
      window.location.href = targetURL;
    }
  });
</script>
        </div>
    </main>
        <script>
        // Данные для поиска
        const searchData = [
            { title: "Main Page", url: "Eng-Glavnaia.html" },
            { title: "About Us", url: "Eng-O_nas.html" },
            { title: "Your Basket", url: "Eng-Korzina.html" },
            { title: "Profile", url: "Eng-Profile.html" },
            { title: "Help", url: "Eng-Help.html" },
            { title: "Change language", url: "Eng-Launguage_Switcher.html" },
            { title: "EasterEgg", url: "Eng-Test.html" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },            
        ];

        const searchInput = document.getElementById('globalSearch');
        const searchResults = document.getElementById('searchResults');

        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase();
            searchResults.innerHTML = '';
            
            if (query.length < 2) {
                searchResults.style.display = 'none';
                return;
            }

            const results = searchData.filter(item => 
                item.title.toLowerCase().includes(query)
            );

            if (results.length > 0) {
                results.forEach(item => {
                    const resultItem = document.createElement('div');
                    resultItem.className = 'search-result-item';
                    resultItem.textContent = item.title;
                    resultItem.addEventListener('click', () => {
                        window.location.href = item.url;
                    });
                    searchResults.appendChild(resultItem);
                });
                searchResults.style.display = 'block';
            } else {
                const noResults = document.createElement('div');
                noResults.className = 'search-result-item';
                noResults.textContent = 'Nothing found...';
                searchResults.appendChild(noResults);
                searchResults.style.display = 'block';
            }
        });

        // Скрываем результаты при клике вне поиска
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-container')) {
                searchResults.style.display = 'none';
            }
        });
    </script>
    <script>
        function scrollToSection(sectionId) {
            document.getElementById(sectionId).scrollIntoView({
                behavior: 'smooth'
            });
        }

        document.getElementById('main-link').addEventListener('click', function(e) {
            e.preventDefault();
            scrollToSection('section1');
        });
    </script>
</body>
</html>
