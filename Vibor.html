<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret.Kot - Выбор фирменных товаров от Секрет Кота</title>
    <style>
        @font-face {
            font-family: 'Ciutadella';
            src: local('CiutadellaDisplay-XBd'), 
                 url('CiutadellaDisplay-XBd.woff') format('woff');
            font-weight: 800;
            font-style: italic;
            font-display: swap;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #FE3231;
            font-family: Arial, sans-serif;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: rgb(255,140,0);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
        }
        
        .logo {
            font-family: 'Ciutadella', Arial, sans-serif;
            font-size: 32px;
            font-weight: 800;
            font-style: italic;
            color: #333;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .nav-buttons {
            display: flex;
            gap: 15px;
        }
        
        .nav-buttons a {
            text-decoration: none;
            color: #333;
            padding: 8px 15px;
            border-radius: 4px;
            transition: all 0.3s;
            font-family: Arial, sans-serif;
        }
        
        .nav-buttons a:hover {
            background-color: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        
        .main-container {
            position: relative;
            width: 100%;
            height: 100vh;
            margin-top: 80px;
        }
        
        .main-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .content-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        
        .choice-title {
            font-family: 'Ciutadella', Arial, sans-serif;
            font-size: 3rem;
            font-weight: 800;
            font-style: italic;
            color: white;
            text-shadow: 3px 3px 0 #000;
            margin-bottom: 40px;
            text-transform: uppercase;
            text-align: center;
        }
        
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 600px;
        }
        
        .choice-btn {
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            padding: 25px;
            font-size: 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 250px;
            text-decoration: none;
            text-align: center;
        }
        
        .choice-btn:hover {
            background: rgba(0,0,0,0.9);
            transform: scale(1.05);
        }
        
        .help-btn {
            position: absolute;
            right: 30px;
            bottom: 30px;
            background: transparent;
            color: white;
            border: none;
            border-bottom: 1px solid white;
            padding: 5px 10px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .help-btn:hover {
            color: #ffdd00;
            border-bottom-color: #ffdd00;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">SECRET.KOT</div>
        <div class="nav-buttons">
            <a href="Glavnaia.html">Главная</a>
            <a href="O_nas.html">О нас</a>
            <a href="Korzina.html">Корзина</a>
            <a href="Profile.html">Профиль</a>
        </div>
    </header>
    
    <div class="main-container">
        <img src="sk.png" alt="Secret.Kot" class="main-image">
        
        <div class="content-overlay">
            <h1 class="choice-title">ВЫ ХОТИТЕ ПРИОБРЕСТИ НАШИ ФИРМЕННЫЕ?</h1>
            
            <div class="buttons-grid">
                <a href="Vibor_Figuri.html" class="choice-btn">Фигурки</a>
                <a href="Vibor_brelka.html" class="choice-btn">Брелки</a>
                <a href="Vibor_Postera.html" class="choice-btn">Постеры</a>
                <a href="Vibor_Mercha.html" class="choice-btn">Мерчи</a>
            </div>
            
            <a href="Help.html" class="help-btn">Нужна помощь?</a>
        </div>
    </div>
</body>
</html>
