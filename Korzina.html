<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret.Kot - Корзина</title>
    <style>
        @font-face {
            font-family: 'Ciutadella';
            src: local('CiutadellaDisplay-XBd'), 
                 url('CiutadellaDisplay-XBd.woff') format('woff');
            font-weight: 800;
            font-style: italic;
            font-display: swap;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: url('sk.png') no-repeat center center fixed;
            background-size: cover;
            font-family: Arial, sans-serif;
            color: white;
            min-height: 100vh;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(254, 50, 49, 0.7);
            z-index: -1;
        }
        
        /* Шапка */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px;
            background-color: rgb(255,140,0);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-family: 'Ciutadella', Arial, sans-serif;
            font-size: 32px;
            font-weight: 800;
            font-style: italic;
            color: #333;
            letter-spacing: 1px;
            text-transform: uppercase;
            position: absolute;
            left: 10%;
            transform: translateX(-50%);
        }
        
        .nav-buttons {
            display: flex;
            gap: 15px;
            margin-left: auto;
        }
        
        .nav-buttons a {
            text-decoration: none;
            color: #333;
            padding: 8px 15px;
            border-radius: 8px;
            transition: all 0.3s;
            font-family: Arial, sans-serif;
        }
        
        .nav-buttons a:hover {
            background-color: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        /* Языковая коробочка для десктопа */
        .language-box {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 5px 10px 5px 5px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(0,0,0,0.1);
            margin-left: 10px;
        }
        
        .language-box:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }
        
        .language-flag {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #333;
        }
        
        .language-name {
            font-size: 14px;
            color: #333;
            font-weight: bold;
        }

        /* Языковая коробочка для мобильных */
        .mobile-language-box {
            display: none;
            position: absolute;
            right: 20px;
            top: 15px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(0,0,0,0.1);
            justify-content: center;
            align-items: center;
        }
        
        .mobile-language-box img {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #333;
        }

         .search-container {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 250px;
            background-color: rgb(255, 100, 0);
            top: 79px;
        }
        
        .search-input {
            padding: 10px 10px;
            border-radius: 0px;
            border: 2px solid #333333;
            width: 250px;
            transition: all 0.3s;
            font-size: 14px;
            background-color: rgb(255, 140, 0);
        }
        
        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            width: 250px;
            background: rgb(255, 100, 0);
            border-radius: 0 0 10px 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            display: none;
        }
        
        .search-result-item {
            padding: 10px 15px;
            border-bottom: solid #00000000;
            cursor: pointer;
            color: rgb(0, 0, 0);
        }
        
        .search-result-item:hover {
            background: rgb(255, 100, 0);
            color: rgb(255, 225, 0);
            border-radius: 0 0 10px 10px;
        }
        
        /* Контент корзины */
        .cart-container {
            max-width: 800px;
            margin: 100px auto;
            padding: 30px;
            background: rgba(255,140,0,0.9);
            border: 3px solid white;
            border-radius: 16px;
            backdrop-filter: blur(5px);
        }
        
        .cart-title {
            font-family: 'Ciutadella', Arial, sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            font-style: italic;
            text-align: center;
            margin-bottom: 30px;
            text-transform: uppercase;
        }
        
        .cart-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            gap: 15px;
        }
        
        .item-image {
            width: 60px;
            height: 60px;
            object-fit: contain;
            border: 2px solid white;
            border-radius: 8px;
        }
        
        .item-details {
            flex: 1;
        }
        
        .item-name {
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        .item-price {
            font-size: 1rem;
        }
        
        .cart-total {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-top: 2px dashed white;
            margin-top: 15px;
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        .checkout-btn {
            width: 100%;
            padding: 15px;
            background: #FE3231;
            border: none;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }
        
        .checkout-btn:hover {
            background: #ff1a1a;
            transform: translateY(-2px);
        }

                /* Адаптивность */
        @media (max-width: 650px) {
            .logo {
                position: static;
                transform: none;
                text-align: center;
                width: 100%;
                padding: 10px;
                   
            }

            .nav-buttons {
                display: none;
            }
            
            .language-box {
                display: block;
            }
            
            .mobile-language-box {
                display: flex;
                top: 20%;
            }
            
            .search-container {
                top: 25%;
                left: 50%;
                transform: translateX(-50%);
                width: 250px;
            }
            
            .search-input {
                width: 250px;
            }
        }

        @media (min-width: 100px) {
            header {
                flex-direction: column;
                padding: 20px;
            }
            
            .logo {
                margin-bottom: 10px;
                font-size: 32px;
                left: 110px;
            }
            
            .search-container {
                top: 100%;
                width: 250px;
            }
            
            .main-title {
                font-size: 8vw;
            } 
            
            .center-button {
                min-width: 250px;
                font-size: 24px;
                padding: 15px 30px;
            }
            
            .scroll-down-btn {
                padding: 10px 20px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">SECRET.KOT</div>

        <!-- Языковая коробочка для мобильных -->
        <div class="mobile-language-box" onclick="window.location.href='Language_Switcher.html'">
            <img src="russian-flag.png" alt="Русский">
        </div>

        <div class="nav-buttons">
            <a href="Glavnaia.html">Главная</a>
            <a href="O_nas.html">О нас</a>
            <a href="Korzina.html" class="active">Корзина</a>
            <a href="Profile.html">Профиль</a>

            <!-- Языковая коробочка для десктопа -->
            <div class="language-box" onclick="window.location.href='Language_Switcher.html'">
                <img src="russian-flag.png" class="language-flag" alt="Русский">
                <div class="language-name">RU</div>
            </div>
            
        </div>
         <div class="search-container">
            <input type="text" class="search-input" placeholder="Поиск товаров..." id="globalSearch">
            <div class="search-results" id="searchResults"></div>
        </div>
    </header>
    
    <div class="cart-container">
        <h1 class="cart-title">Ваша корзина</h1>
        
        <!-- Товар 1 - Постер -->
        <div class="cart-item">
            <img src="poster.png" alt="Постер" class="item-image">
            <div class="item-details">
                <div class="item-name">Постер "Лунный кот"</div>
                <div class="item-price">899 ₽</div>
            </div>
        </div>
        
        <!-- Товар 2 - Брелок -->
        <div class="cart-item">
            <img src="brelok.png" alt="Брелок" class="item-image">
            <div class="item-details">
                <div class="item-name">Брелок "Секретный кот"</div>
                <div class="item-price">499 ₽</div>
            </div>
        </div>
        
        <div class="cart-total">
            <span>Итого:</span>
            <span>1 398 ₽</span>
        </div>
        
        <button class="checkout-btn">Оформить заказ</button>
    </div>
    <script>
        // Данные для поиска
        const searchData = [
            { title: "Главная", url: "Glavnaia.html" },
            { title: "О нас", url: "O_nas.html" },
            { title: "Корзина", url: "Korzina.html" },
            { title: "Профиль", url: "Profile.html" },
            { title: "Помощь", url: "Help.html" },
            { title: "Сменить язык", url: "Launguage_Switcher.html" },
            { title: "Пасхалочка", url: "Test.html" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },
            { title: "", url: "" },            
        ];

        const searchInput = document.getElementById('globalSearch');
        const searchResults = document.getElementById('searchResults');

        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase();
            searchResults.innerHTML = '';
            
            if (query.length < 2) {
                searchResults.style.display = 'none';
                return;
            }

            const results = searchData.filter(item => 
                item.title.toLowerCase().includes(query)
            );

            if (results.length > 0) {
                results.forEach(item => {
                    const resultItem = document.createElement('div');
                    resultItem.className = 'search-result-item';
                    resultItem.textContent = item.title;
                    resultItem.addEventListener('click', () => {
                        window.location.href = item.url;
                    });
                    searchResults.appendChild(resultItem);
                });
                searchResults.style.display = 'block';
            } else {
                const noResults = document.createElement('div');
                noResults.className = 'search-result-item';
                noResults.textContent = 'Ничего не найдено';
                searchResults.appendChild(noResults);
                searchResults.style.display = 'block';
            }
        });

        // Скрываем результаты при клике вне поиска
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-container')) {
                searchResults.style.display = 'none';
            }
        });
    </script>
    <script>
        function scrollToSection(sectionId) {
            document.getElementById(sectionId).scrollIntoView({
                behavior: 'smooth'
            });
        }

        document.getElementById('main-link').addEventListener('click', function(e) {
            e.preventDefault();
            scrollToSection('section1');
        });
    </script>
</body>
</html>
